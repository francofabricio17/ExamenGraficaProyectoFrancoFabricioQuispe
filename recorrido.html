<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador 3D - Plaza del Minero</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Orbitron:wght@700;900&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* RESET Y CONFIGURACIÓN BASE */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0a0c10;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* FONDO EVOCATIVO CON DEGRADADO */
        .fondo-recorrido {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: radial-gradient(circle at 50% 50%, rgba(20, 35, 45, 0.4) 0%, #0a0c10 90%);
            z-index: -2;
        }

        /* MENÚ LATERAL IZQUIERDO */
        .sidebar-menu {
            position: absolute;
            left: 40px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 20px;
            pointer-events: auto;
        }

        .sidebar-menu a {
            display: inline-block;
            background: rgba(15, 17, 21, 0.6);
            color: rgba(255, 255, 255, 0.7);
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 2px;
            padding: 15px 35px;
            border-radius: 35px; 
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            width: 200px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .sidebar-menu a:hover, .sidebar-menu a.active {
            background: linear-gradient(135deg, #d46b7a 0%, #4a7fa0 100%); 
            color: #ffffff;
            border-color: transparent;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(212, 107, 122, 0.4);
            filter: brightness(1.1);
        }

        /* TÍTULO SUPERIOR ANIMADO */
        .header-title {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Cinzel Decorative', serif;
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 8px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffffff 10%, #d46b7a 50%, #4a7fa0 90%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 15px 30px rgba(0,0,0,0.7);
            z-index: 5;
            text-align: center;
            white-space: nowrap;
            animation: brilloTexto 4s linear infinite;
        }

        @keyframes brilloTexto {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* CONTENEDOR DEL VISOR 3D */
        .contenedor-visor {
            flex: 1;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        #canvas-3d {
            width: 100%;
            height: 100%;
            display: block;
            background: #0f1115;
        }

        /* BOTÓN POSICIONADO AL LADO DERECHO */
        .contenedor-recorrido-btn {
            position: absolute;
            bottom: 50px;
            right: 60px; /* Alineado a la derecha */
            left: auto;
            z-index: 10;
        }

        .btn-iniciar-recorrido {
            background: linear-gradient(135deg, #4a7fa0 0%, #d46b7a 100%);
            border: none;
            color: #ffffff;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            padding: 18px 45px;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 6px 25px rgba(212, 107, 122, 0.4);
            transition: all 0.4s ease;
        }

        .btn-iniciar-recorrido:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 35px rgba(212, 107, 122, 0.6);
            filter: brightness(1.2);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div class="fondo-recorrido"></div>

    <nav class="sidebar-menu">
        <a href="index.html">Inicio</a>
        <a href="fotografias.html">Galería</a>
        <a href="modelo.html" class="active">Modelo 3D</a>
        <a href="informacion.html">Anterior</a>
    </nav>

    <h1 class="header-title">Modelo 3D "Plaza Minero"</h1>

    <main class="contenedor-visor">
        <div id="canvas-3d"></div>
    </main>

    <div class="contenedor-recorrido-btn">
        <a href="index.html" class="btn-iniciar-recorrido">Iniciar Recorrido</a>
    </div>

    <script>
        // 1. CONFIGURACIÓN BÁSICA DEL ESCENARIO
        const contenedor = document.getElementById('canvas-3d');
        const escena = new THREE.Scene();
        escena.background = new THREE.Color('#0a0c10'); 
        escena.fog = new THREE.FogExp2('#0a0c10', 0.005);

        // Cámara
        const camara = new THREE.PerspectiveCamera(45, contenedor.clientWidth / contenedor.clientHeight, 0.1, 1000);
        
        // Renderizador
        const renderizador = new THREE.WebGLRenderer({ antialias: true });
        renderizador.setSize(contenedor.clientWidth, contenedor.clientHeight);
        renderizador.setPixelRatio(window.devicePixelRatio);
        renderizador.toneMapping = THREE.ACESFilmicToneMapping;
        renderizador.toneMappingExposure = 1.1;
        contenedor.appendChild(renderizador.domElement);

        // 2. ILUMINACIÓN COMPLETA
        const luzAmbiental = new THREE.AmbientLight(0xffffff, 0.9);
        escena.add(luzAmbiental);

        const luzDireccional1 = new THREE.DirectionalLight(0xffffff, 1.2); 
        luzDireccional1.position.set(30, 50, 20);
        escena.add(luzDireccional1);

        const luzDireccional2 = new THREE.DirectionalLight(0x4a7fa0, 0.8); 
        luzDireccional2.position.set(-30, 30, -20);
        escena.add(luzDireccional2);

        // 3. PLATAFORMA BASE (Se redujo el radio de 28/29 a 22/23 para hacerla más pequeña)
        const altoPlataforma = 1;
        const sueloGeo = new THREE.CylinderGeometry(22, 23, altoPlataforma, 64);
        const sueloMat = new THREE.MeshStandardMaterial({ 
            color: 0x141821, 
            roughness: 0.7,
            metalness: 0.3
        });
        const plataforma = new THREE.Mesh(sueloGeo, sueloMat);
        plataforma.position.y = altoPlataforma / 2; 
        escena.add(plataforma);

        const grupoModelo = new THREE.Group();
        escena.add(grupoModelo);

        // Valores por defecto
        let radioCamara = 60; 
        let alturaCamara = 35; 
        let anguloCamara = 0;
        
        const objetivoMirada = new THREE.Vector3(0, altoPlataforma, 0);

        // 4. CARGA DEL MODELO REAL
        const cargador = new THREE.GLTFLoader();
        cargador.load(
            'assets/Plaza1.glb',
            function (gltf) {
                const modelo = gltf.scene;
                
                // Centrar horizontalmente la plaza
                const cajaContenedora = new THREE.Box3().setFromObject(modelo);
                const centro = new THREE.Vector3();
                cajaContenedora.getCenter(centro);
                
                modelo.position.x += (modelo.position.x - centro.x);
                modelo.position.z += (modelo.position.z - centro.z);
                modelo.position.y += (modelo.position.y - cajaContenedora.min.y) + altoPlataforma; 

                grupoModelo.add(modelo);

                // Re-calculo de proporciones
                const tamaño = new THREE.Vector3();
                cajaContenedora.getSize(tamaño);
                
                const anchoMaximo = Math.max(tamaño.x, tamaño.z);
                
                radioCamara = anchoMaximo * 1.1; 
                alturaCamara = anchoMaximo * 0.75; 
            },
            function (xhr) {
                console.log((xhr.loaded / xhr.total * 100) + '% cargado');
            },
            function (error) {
                console.error('Hubo un error cargando el modelo plaza1.glb:', error);
            }
        );

        // Redimensionamiento adaptativo
        window.addEventListener('resize', () => {
            camara.aspect = contenedor.clientWidth / contenedor.clientHeight;
            camara.updateProjectionMatrix();
            renderizador.setSize(contenedor.clientWidth, contenedor.clientHeight);
        });

        // 5. BUCLE DE ANIMACIÓN
        function animate() {
            requestAnimationFrame(animate);
            
            anguloCamara += 0.0012; 
            camara.position.x = Math.cos(anguloCamara) * radioCamara;
            camara.position.z = Math.sin(anguloCamara) * radioCamara;
            camara.position.y = alturaCamara; 
        
            camara.lookAt(objetivoMirada);

            renderizador.render(escena, camara);
        }
        animate();
    </script>
</body>
</html>
